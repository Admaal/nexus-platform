name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: scripts/gates.ps1 ci
        shell: pwsh
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: ./scripts/gates.ps1 ci

  db-tests:
    name: Tests de base de datos (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Arrancar Supabase local
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,realtime,postgres-meta,supavisor
      - name: supabase test db
        run: supabase test db

  gate:
    name: Gate obligatorio
    if: ${{ always() }}
    needs: [gates, db-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar resultados
        shell: pwsh
        run: |
          if ("${{ needs.gates.result }}" -ne "success" -or "${{ needs.db-tests.result }}" -ne "success") { exit 1 }
